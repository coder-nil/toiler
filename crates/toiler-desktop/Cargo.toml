[package]
name = "toiler-desktop"
version = "1.0.10"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "toiler 的桌面壳：Tauri 单进程（axum 同进程 + 内嵌前端）"
default-run = "toiler-desktop"

[lib]
name = "toiler_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
toiler-server = { path = "../toiler-server" }
tauri = { version = "2.0.0", features = ["unstable", "image-png", "macos-private-api"] }
# pi 前端在 __PI_WEB_DESKTOP__ 为 true 时走 tauri 通知（lib/desktop-notifications.ts）
tauri-plugin-notification = "2"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = "0.1"
libc = "0.2"
# 寿星天文历：离线计算四立交节时刻，不依赖网络、固定日期或电脑所在时区。
lunar_rust = "1.0.1"
# 内置终端的跨平台 PTY（与 pi 同一版本）。只在桌面壳里用：服务端不该有起 shell 的能力。
portable-pty = "0.9"

# macOS 红绿灯（窗口控制按钮）定位：直接摆 NSWindow 的标准按钮。
# wry 的 traffic_light_position 语义是“拉高 titlebar 容器”，按钮最终落在哪
# 取决于 AppKit 的默认布局；我们要的是“圆心对到顶栏中线”，只能自己算。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSView", "NSApplication", "NSImage", "NSColor", "NSVisualEffectView", "NSAppearance", "NSUserInterfaceItemIdentification", "NSWorkspace", "NSAccessibility"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

# Windows 仅使用官方 DWM/窗口/辅助功能/注册表接口；不启动子进程，不修改系统设置。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_System_Registry"] }
