# 推送 tag（`vX.Y.Z`）自动编译三平台安装包，并把产物挂到同名 GitHub Release。
#
# 为什么 CI 里要跑前端构建：`toiler-server/build.rs` 会把
# `crates/toiler-desktop/frontend/dist/` 嵌进二进制（include_dir!），而 dist/
# 不入库、Tauri 的 `frontendDist` 只指向 `shell/`（窗口占位页）。所以不跑
# `npm run build` 的产物里只有占位页——界面能开但白屏，API 全在。构建顺序因此
# 固定为：npm ci → npm run build → tauri build。
#
# 发布流程：
#   git tag v0.1.0 && git push origin v0.1.0
# tag 必须与 `crates/toiler-desktop/tauri.conf.json` 的 version 一致（有校验步骤）；
# 换版本时改 tauri.conf.json（以及各 crate 的 version）后提交，再打 tag。
name: Release

on:
  push:
    tags: ["v*"]
  # 手动跑只产出 artifact，不创建 Release（ref 不是 tag）。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"

jobs:
  build:
    name: 构建 · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            paths: |
              target/**/release/bundle/dmg/*.dmg
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            paths: |
              target/**/release/bundle/dmg/*.dmg
          - label: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            paths: |
              target/**/release/bundle/deb/*.deb
              target/**/release/bundle/appimage/*.AppImage
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            paths: |
              target/**/release/bundle/nsis/*.exe

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: crates/toiler-desktop/frontend/package-lock.json

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          # 显式 --target 时 cargo 把产物写到 target/<triple>/release，
          # 另一个平台的 target 也要装上（macOS 两个 job 是交叉编译）。
          targets: ${{ matrix.target }}

      - name: 缓存 cargo 产物
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 安装 Linux 打包依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libfuse2 \
            file \
            wget

      - name: 构建前端（Next 静态导出 → crates/toiler-desktop/frontend/dist）
        working-directory: crates/toiler-desktop/frontend
        run: |
          npm ci
          npm run build

      - name: 校验 tag 与 tauri.conf.json 的 version 一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./crates/toiler-desktop/tauri.conf.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 tauri.conf.json 的 version $version 不一致（应为 v$version）"
            exit 1
          fi

      - name: 打包（tauri build）
        working-directory: crates/toiler-desktop
        env:
          # AppImage 的打包器会挂载 linuxdeploy 的 AppImage；CI 容器里没有 FUSE，
          # 必须让它自解压运行，否则 Linux job 卡在 bundling 阶段。
          APPIMAGE_EXTRACT_AND_RUN: "1"
        # 用 npx 而不是全局装 CLI：runner 上的 npm 全局前缀不一定可写，npx 只依赖
        # npm 缓存。`--target` 显式指定后 cargo 把产物写到 target/<triple>/release，
        # 所以下面的 upload-artifact glob 都带这一层。
        run: npx --yes @tauri-apps/cli@^2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: toiler-${{ matrix.target }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release 并附上安装包
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # 形如 v0.2.0-beta.1 的 tag 标成预发布。
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## 安装说明

            - **macOS**：安装包未做代码签名/公证，首次打开请右键 →「打开」，
              或执行 `xattr -dr com.apple.quarantine /Applications/Toiler.app`。
            - **Windows**：未签名，SmartScreen 会提示，选「更多信息」→「仍要运行」。
            - **Linux**：`.deb` 用 `sudo apt install ./xxx.deb`；`.AppImage` 先
              `chmod +x` 再运行（需要系统有 WebKitGTK 4.1）。
