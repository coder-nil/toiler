[workspace]
members = [
    "crates/toiler-poc",
    "crates/toiler-session",
    "crates/toiler-server",
    "crates/toiler-desktop",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "MIT"

[workspace.dependencies]
# 唯一来源：crates.io 上发布的 rpi。不本地改、不用 path 依赖，
# 升级 = 改这里的版本号 + cargo update。
rpi-ai = "0.21"
rpi-agent = "0.21"
rpi-tools = "0.21"
rpi-harness = "0.21"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"

# 阶段 4：单二进制，release 去掉符号表（安装包体积直接少几 MB）。
[profile.release]
strip = "symbols"
